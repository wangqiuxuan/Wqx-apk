name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Buildozer in Docker
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            kivy/buildozer:latest \
            android debug

      - name: Fix permissions
        run: |
          sudo chown -R $USER:$USER .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dice-apk
          path: bin/*.apk
          if-no-files-found: error
